<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync · Execução</title><link rel="stylesheet" href="./vendor/fonts/fonts.css"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none;font-family:"Segoe UI",sans-serif}
#execution-root{display:flex;justify-content:center}
.execution-notch{position:relative;display:flex;align-items:center;gap:7px;width:250px;height:54px;box-sizing:border-box;padding:0 13px 0 3px;border:1px solid #70dfcc35;border-top:0;border-radius:0 0 22px 22px;background:linear-gradient(135deg,#071322fc,#06101ffc);box-shadow:0 5px 18px #00debf12;overflow:hidden;transform-origin:50% 0;animation:arrive .65s cubic-bezier(.16,1,.3,1) both}
.execution-notch::after{content:"";position:absolute;bottom:0;left:26px;right:26px;height:1px;background:linear-gradient(90deg,transparent,#79ead494,transparent)}
.execution-notch canvas{flex-shrink:0}.execution-notch span{display:flex;flex-direction:column;gap:4px;min-width:0}.execution-notch strong{font-size:12px;font-weight:550;color:#dbf4ef}.execution-notch em{font-size:9px;font-weight:400;font-style:normal;color:#729fa7;margin-left:5px}.execution-notch small{font-size:10px;color:#94c5bf;white-space:nowrap;animation:status-in .4s ease-out both}.execution-notch i{width:5px;height:5px;border-radius:50%;background:#76e6cd;margin-left:auto;animation:breathe 3s ease-in-out infinite}
.execution-leave .execution-notch{animation:depart .4s ease-in both}
@keyframes arrive{from{opacity:0;transform:translateY(-30px) scale(.94)}to{opacity:1;transform:none}}@keyframes depart{to{opacity:0;transform:translateY(-32px) scale(.96)}}@keyframes status-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}@keyframes breathe{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="execution-root"></div><script type="module" src="./execution-notch.js"></script></body></html>
